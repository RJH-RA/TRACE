[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-tfe3"
version = "0.1.0"
description = "Pathology-privileged learning for TFE3-rRCC identification from preoperative CT"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "numpy<2",
  "pandas",
  "pyyaml",
  "torch",
  "torchvision",
  "timm>=1.0.3",
  "einops",
  "nibabel",
  "SimpleITK",
  "scikit-image",
  "scikit-learn",
  "openslide-python",
  "tqdm",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["trace_tfe3*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
